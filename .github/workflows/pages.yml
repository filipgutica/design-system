name: Pages

# The site shows the released version, which semantic-release tags in the Release workflow, so the
# deploy waits for Release to finish on main. Pull requests build the site without deploying it.
on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The commit Release built, with its tags: the site build reads the version from the latest v* tag.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v5
      - run: pnpm site:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      # A re-run of an older Release must not deploy its commit over a newer site, so a Release run
      # deploys only while its commit is still the head of main. A manual run deploys what it built.
      - id: current
        env:
          EVENT: ${{ github.event_name }}
          BUILT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" != workflow_run ] || [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BUILT" ]; then
            echo current=true >> "$GITHUB_OUTPUT"
          else
            echo "Skipping the deploy: $BUILT is no longer the head of main."
            echo current=false >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
