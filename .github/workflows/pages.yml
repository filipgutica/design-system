name: Pages

# The site shows the released version, which semantic-release tags in the Release workflow, so the
# deploy waits for Release to finish on main. Pull requests build the site without deploying it.
# Each successful Release run deploys the commit it built, or the release commit it tagged on top of
# it. A manual re-run of an older Release would deploy that older commit; the next Release or a manual
# run of this workflow restores main.
on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The commit Release built, with its tags: the site build reads the version from the latest ds-v* tag.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      # A release commits the stamped plugin manifests on top of the commit Release built and tags that
      # release commit, so the tag is not an ancestor of head_sha. Build that release commit instead: the
      # tagged child of head_sha, never a later release.
      - name: Check out the release commit when this Release run tagged one
        if: github.event_name == 'workflow_run'
        run: |
          built=$(git rev-parse HEAD)
          for tag in $(git tag --contains HEAD --list 'ds-v*'); do
            if [ "$(git rev-parse "$tag^{commit}^")" = "$built" ]; then git checkout --quiet "$tag"; break; fi
          done
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: pnpm site:build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
