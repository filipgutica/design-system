name: PR title

# A squash merge makes the commit header that Release lints: with the repository's COMMIT_OR_PR_TITLE
# setting, a one-commit PR's commit subject, or else the PR title, plus " (#<number>)". A header
# commitlint rejects there blocks the release, so lint it here, and again when the title is edited.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate the squash commit header
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ "$COMMITS" = 1 ]; then TITLE=$(git log -1 --format=%s); fi
          printf '%s (#%s)\n' "$TITLE" "$NUMBER" | pnpm exec commitlint --verbose
